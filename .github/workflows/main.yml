name: Camera APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract Camera ZIP parts and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify both ZIP files
      - name: Verify both project ZIP files
        shell: bash
        run: |
          set -euo pipefail

          PART1="$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-1.zip"
          PART2="$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-2-v1.1.zip"

          for FILE in "$PART1" "$PART2"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required ZIP file is missing: $(basename "$FILE")"
              echo "Upload both ZIP files to the repository root."
              exit 1
            fi

            echo "Found: $(basename "$FILE")"
            echo "Size: $(du -h "$FILE" | cut -f1)"

            unzip -tq "$FILE"
          done

          echo "Both ZIP archives passed integrity checks."

      # Extract both ZIPs into the same project folder
      - name: Extract and validate Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/camera-project"
          mkdir -p "$EXTRACT_DIR"

          unzip -oq \
            "$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-1.zip" \
            -d "$EXTRACT_DIR"

          unzip -oq \
            "$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-2-v1.1.zip" \
            -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/ProCameraElite"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/procamera/elite/MainActivity.kt"
          )

          for RELATIVE_FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$PROJECT_DIR/$RELATIVE_FILE" ]]; then
              echo "::error::Missing project file: $RELATIVE_FILE"
              exit 1
            fi
          done

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extraction completed successfully."

      # Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      # Verify Java, Android SDK and Gradle
      - name: Verify build environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          java -version
          sdkmanager --list_installed
          ./gradlew --version

      # Validate Gradle wrapper
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Build Debug and Release APK
      - name: Build debug and release APKs
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug \
            assembleRelease

      # Verify generated APK files
      - name: Verify APK outputs and prepare checksums
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="$PROJECT_DIR/app/build/outputs/apk"
          OUTPUT_DIR="$RUNNER_TEMP/camera-apk-artifacts"

          if [[ ! -d "$APK_ROOT" ]]; then
            echo "::error::Gradle did not create the APK output directory."
            exit 1
          fi

          mapfile -t DEBUG_APKS < <(
            find "$APK_ROOT/debug" \
              -maxdepth 1 -type f -name "*.apk" 2>/dev/null | sort
          )

          mapfile -t RELEASE_APKS < <(
            find "$APK_ROOT/release" \
              -maxdepth 1 -type f -name "*.apk" 2>/dev/null | sort
          )

          if [[ "${#DEBUG_APKS[@]}" -eq 0 ]]; then
            echo "::error::No debug APK was generated."
            find "$APK_ROOT" -type f -print || true
            exit 1
          fi

          if [[ "${#RELEASE_APKS[@]}" -eq 0 ]]; then
            echo "::error::No release APK was generated."
            find "$APK_ROOT" -type f -print || true
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          cp "${DEBUG_APKS[0]}" \
            "$OUTPUT_DIR/Camera-debug.apk"

          cp "${RELEASE_APKS[0]}" \
            "$OUTPUT_DIR/Camera-release.apk"

          cd "$OUTPUT_DIR"

          sha256sum \
            Camera-debug.apk \
            Camera-release.apk \
            > SHA256SUMS.txt

          echo "APK artifacts prepared:"
          ls -lh "$OUTPUT_DIR"

      # Upload APKs to GitHub Actions
      - name: Upload Camera APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Pro-Camera-Elite-APKs
          path: |
            ${{ runner.temp }}/camera-apk-artifacts/Camera-debug.apk
            ${{ runner.temp }}/camera-apk-artifacts/Camera-release.apk
            ${{ runner.temp }}/camera-apk-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

name: Camera APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract project parts and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check both project ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          PART1="$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-1.zip"
          PART2="$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-2.zip"

          test -f "$PART1" || {
            echo "::error::Missing Camera-Pro-Camera-Elite-Part-1.zip in repository root."
            exit 1
          }
          test -f "$PART2" || {
            echo "::error::Missing Camera-Pro-Camera-Elite-Part-2.zip in repository root."
            exit 1
          }

          echo "Part 1 size: $(du -h "$PART1" | cut -f1)"
          echo "Part 2 size: $(du -h "$PART2" | cut -f1)"

          unzip -tq "$PART1"
          unzip -tq "$PART2"

      - name: Extract both ZIP parts into one project folder
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/camera-project"
          mkdir -p "$EXTRACT_DIR"

          # Extract both archives into the same destination.
          unzip -oq "$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-1.zip" -d "$EXTRACT_DIR"
          unzip -oq "$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-2.zip" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/ProCameraElite"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Show build environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          ./gradlew --version

      - name: Build debug and release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Verify APK outputs and generate checksums
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"
          test -d "$APK_DIR"

          find "$APK_DIR" -type f -name "*.apk" -print
          APK_COUNT="$(find "$APK_DIR" -type f -name "*.apk" | wc -l)"
          test "$APK_COUNT" -ge 2 || {
            echo "::error::Expected debug and release APK files, but found $APK_COUNT."
            exit 1
          }

          find "$APK_DIR" -type f -name "*.apk" -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$PROJECT_DIR/SHA256SUMS.txt"

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Camera-APK-Build
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

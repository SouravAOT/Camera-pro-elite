
name: Camera APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Camera Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Check both ZIP files
      - name: Verify Project ZIP Parts
        shell: bash
        run: |
          set -euo pipefail

          PART1="$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-1.zip"
          PART2="$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-2.zip"

          if [ ! -f "$PART1" ]; then
            echo "::error::Part 1 ZIP not found."
            exit 1
          fi

          if [ ! -f "$PART2" ]; then
            echo "::error::Part 2 ZIP not found."
            exit 1
          fi

          echo "Checking Part 1..."
          unzip -tq "$PART1"

          echo "Checking Part 2..."
          unzip -tq "$PART2"

          echo "Both ZIP files are valid."

      # Extract both parts into the same directory
      - name: Extract Both ZIP Parts
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/camera-project"
          mkdir -p "$EXTRACT_DIR"

          unzip -oq \
            "$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-1.zip" \
            -d "$EXTRACT_DIR"

          unzip -oq \
            "$GITHUB_WORKSPACE/Camera-Pro-Camera-Elite-Part-2.zip" \
            -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/ProCameraElite"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$PROJECT_DIR/$FILE" ]; then
              echo "::error::Missing project file: $FILE"
              exit 1
            fi
          done

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully."

      # Java 17
      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # IMPORTANT:
      # Do not install the obsolete Android SDK "tools" package.
      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
          accept-android-sdk-licenses: true

      # Install required SDK platform and build tools
      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Android SDK components installed."

      # Verify environment
      - name: Verify Java and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      # Build both APK variants
      - name: Build Debug and Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug \
            assembleRelease

      # Collect APKs
      - name: Verify and Collect APK Files
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"
          OUTPUT_DIR="$RUNNER_TEMP/camera-apk-output"

          mkdir -p "$OUTPUT_DIR"

          DEBUG_APK="$APK_DIR/debug/app-debug.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          RELEASE_APK="$(find "$APK_DIR/release" \
            -maxdepth 1 -type f -name "*.apk" | head -n 1)"

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          cp "$DEBUG_APK" "$OUTPUT_DIR/Camera-debug.apk"
          cp "$RELEASE_APK" "$OUTPUT_DIR/Camera-release.apk"

          cd "$OUTPUT_DIR"

          sha256sum *.apk > SHA256SUMS.txt

          echo "APK files collected successfully."
          ls -lh

      # Upload APK artifacts
      - name: Upload Camera APKs
        uses: actions/upload-artifact@v4
        with:
          name: Camera-APK-Build
          path: |
            ${{ runner.temp }}/camera-apk-output/Camera-debug.apk
            ${{ runner.temp }}/camera-apk-output/Camera-release.apk
            ${{ runner.temp }}/camera-apk-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

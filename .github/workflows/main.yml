name: Build Camera Pro Elite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP Files
        shell: bash
        run: |
          set -euo pipefail

          test -f "Camera-Pro-Camera-Elite-Part-1.zip"
          test -f "Camera-Pro-Camera-Elite-Part-2-v1.1.zip"

          unzip -t "Camera-Pro-Camera-Elite-Part-1.zip"
          unzip -t "Camera-Pro-Camera-Elite-Part-2-v1.1.zip"

          echo "Both ZIP files verified successfully."

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

          echo "Android SDK packages installed."

      - name: Extract Camera Project ZIP Parts
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/camera-project"
          mkdir -p "$PROJECT_DIR"

          unzip -q "Camera-Pro-Camera-Elite-Part-1.zip" -d "$PROJECT_DIR"
          unzip -q "Camera-Pro-Camera-Elite-Part-2-v1.1.zip" -d "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR/ProCameraElite" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/ProCameraElite/settings.gradle.kts"
          test -f "$PROJECT_DIR/ProCameraElite/gradlew"
          test -f "$PROJECT_DIR/ProCameraElite/app/build.gradle.kts"

          echo "Camera project extracted successfully."

      - name: Make Gradle Executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ runner.temp }}/camera-project/ProCameraElite
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug

      - name: Build Release APK
        shell: bash
        working-directory: ${{ runner.temp }}/camera-project/ProCameraElite
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk-output"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" \
            -exec cp {} "$RUNNER_TEMP/apk-output/" \;

          test -n "$(find "$RUNNER_TEMP/apk-output" -name "*.apk" -print -quit)"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Pro-Camera-Elite-APKs
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
